<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Kim Jiyun - Frontend Developer to Financial IT Fullstack">
  <title>Kim Jiyun — Frontend Developer → Financial IT, Fullstack</title>
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="260" rx="18"/>
    </clipPath>
    <clipPath id="uclip">
      <rect x="60" y="152" width="330" height="12"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>

    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>

    <linearGradient id="name" x1="60" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="0.6" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.4" fill="#1B2748"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)" opacity="0.55"/>

    <ellipse cx="880" cy="40" rx="300" ry="200" fill="url(#glow)">
      <animate attributeName="rx" values="300;340;300" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="250" rx="260" ry="150" fill="url(#glow2)">
      <animate attributeName="ry" values="150;180;150" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="0" y="0" width="1000" height="3" fill="url(#acc)" opacity="0.9"/>

    <!-- constellation : subscription state graph -->
    <g stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1" fill="none">
      <path d="M748 92 L868 68 L932 148 L816 172 Z" stroke-dasharray="420" stroke-dashoffset="420">
        <animate attributeName="stroke-dashoffset" from="420" to="0" dur="2.4s" fill="freeze"/>
      </path>
      <path d="M868 68 L816 172" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="0" dur="2.4s" begin="0.6s" fill="freeze"/>
      </path>
      <path d="M932 148 L890 214" stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" from="80" to="0" dur="2.4s" begin="1s" fill="freeze"/>
      </path>
    </g>

    <g fill="#6366F1">
      <circle cx="748" cy="92" r="4.5"/>
      <circle cx="868" cy="68" r="4.5" fill="#22D3EE"/>
      <circle cx="932" cy="148" r="4.5"/>
      <circle cx="816" cy="172" r="4.5" fill="#2DD4BF"/>
      <circle cx="890" cy="214" r="3.5" fill="#22D3EE" fill-opacity="0.7"/>
    </g>

    <g fill="none" stroke-width="1.4">
      <circle cx="868" cy="68" r="7" stroke="#22D3EE">
        <animate attributeName="r" values="7;18;7" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.85;0;0.85" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="816" cy="172" r="7" stroke="#2DD4BF">
        <animate attributeName="r" values="7;18;7" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle r="3.2" fill="#E8ECFF">
      <animateMotion dur="7s" repeatCount="indefinite" path="M748 92 L868 68 L932 148 L816 172 Z"/>
      <animate attributeName="fill-opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- type -->
    <text x="60" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" letter-spacing="3.4" fill="#22D3EE" fill-opacity="0.85">FRONTEND · FULLSTACK IN PROGRESS</text>

    <text x="60" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="52" font-weight="700" fill="url(#name)">Kim Jiyun</text>

    <rect x="60" y="156" width="330" height="2" rx="1" fill="#1E2A4D"/>
    <g clip-path="url(#uclip)">
      <rect x="-150" y="154" width="150" height="4" rx="2" fill="url(#acc)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 560 0" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="60" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="17" fill="#93A3CC">김지윤 &#183; Frontend Developer &#8594; Financial IT, Fullstack</text>

    <circle cx="66" cy="222" r="4" fill="#2DD4BF">
      <animate attributeName="fill-opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#5E6F99">running <tspan fill="#E8ECFF">dailyq.me</tspan> &#183; 매일 07:00, 기술 면접 질문 한 통</text>
  </g>
</svg>
